# ---------------------------------------------------------------------------
# Domain skill pack: linear algebra + ordinary differential equations
#
# This file is the C4C *migration* artifact. The starter kit shipped a single
# domain pack, `domain_skills/calculus_limits.yaml`, tied to the limit engine.
# Adding a second, structurally different pack is the cheapest honest proof that
# the pipeline is domain-extensible rather than a one-off script: no code in
# ingest/parse/render changed, only this declarative pack plus one solver
# registry module.
#
# Contract (mirrors the starter pack's shape):
#   domain        machine name, also used as `--domain` value
#   solver_module python module the `solver` ids are resolved against
#   patterns      ordered rules; first match wins
#     match       list of regexes, ALL must hit the problem text (re.I)
#     solver      registry id in solver_module
#     needs       named fields the solver expects; `extract` says how they are
#                 obtained (numbered-symbol extraction / matrix literal / free
#                 text passthrough)
#   fallback      used when nothing matches; must never fabricate an answer
# ---------------------------------------------------------------------------
domain: linear_algebra_ode
display: "\u7ebf\u6027\u4ee3\u6570\u4e0e\u5e38\u5fae\u5206\u65b9\u7a0b"
version: 1
solver_module: solve_kernel

patterns:
  - id: la_matrix_form
    match:
      - "(?i)matrix|matrices|\u77e9\u9635"
    solver: la_matrix_form
    needs:
      rows: { extract: matrix_literal }
      rhs: { extract: vector_literal, optional: true }
    notes: >-
      Handles determinant / inverse / transpose / rank questions phrased around
      an explicit matrix literal. The matrix is read from the problem text, not
      guessed.

  - id: la_eigen
    match:
      - "(?i)eigen|characteristic|\u7279\u5f81\u503c|\u7279\u5f81\u5411\u91cf"
    solver: la_eigen
    needs:
      rows: { extract: matrix_literal }
    notes: Characteristic polynomial, eigenvalues and eigenvectors over the reals.

  - id: la_solve_linear_system
    match:
      - "(?i)solve the system|linear system|\u7ebf\u6027\u65b9\u7a0b\u7ec4|\u89e3\u65b9\u7a0b\u7ec4"
    solver: la_solve_linear_system
    needs:
      equations: { extract: equations }
    notes: Uses sympy.linsolve; reports the solution set parameterised honestly
      when under-determined.

  - id: ode_separable_first_order
    match:
      - "(?i)dy/dx|y'|y\u2032|\u5fae\u5206\u65b9\u7a0b|differential equation"
      - "(?i)separable|\u53ef\u5206\u79bb"
    solver: ode_separable
    needs:
      equation: { extract: ode_equation }
      ic: { extract: initial_condition, optional: true }
    notes: dsolve with hint='separable'; falls back to 'default' classification
      and records which hint actually produced the answer.

  - id: ode_linear_first_order
    match:
      - "(?i)dy/dx|y'|y\u2032|\u5fae\u5206\u65b9\u7a0b|differential equation"
      - "(?i)integrating factor|first-order linear|\u4e00\u9636\u7ebf\u6027"
    solver: ode_linear_first
    needs:
      equation: { extract: ode_equation }
      ic: { extract: initial_condition, optional: true }
    notes: Integrating-factor path; the factor itself is shown in the steps so
      the reader can check the method, not just the answer.

  - id: ode_second_order_constant_coeff
    match:
      - "(?i)y''|y''|y\u2033|\u4e8c\u9636"
      - "(?i)differential equation|\u5fae\u5206\u65b9\u7a0b"
    solver: ode_second_order_cc
    needs:
      equation: { extract: ode_equation }
      ic: { extract: initial_condition, optional: true }
    notes: Characteristic-root method with distinct / repeated / complex branches
      reported separately.

fallback: unsolved   # emit the problem text back with an explicit "not solved"
                     # marker; never a plausible-looking guess

# Oracle hooks: each pattern points at an independent check so the validation
# report can verify correctness without trusting the solver's own output.
oracles:
  la_matrix_form: check_substitution   # A @ A^-1 == I
  la_eigen: check_eigenpair            # A v == lambda v
  la_solve_linear_system: check_substitution  # residual of every equation
  ode_separable: check_ode_residual    # plug y(x) into the ODE, expect 0
  ode_linear_first: check_ode_residual
  ode_second_order_cc: check_ode_residual
